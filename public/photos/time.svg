<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg5)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.65" />
  <!-- Moon, stars, and clock without rush -->
  <g transform="translate(135, 110)">
    <!-- Crescent Moon -->
    <path d="M75,25 A30,30 0 0,0 75,95 A38,38 0 1,1 75,25" fill="#3b82f6" />
    <!-- Twinkling stars -->
    <text x="20" y="45" font-size="20">⭐</text>
    <text x="35" y="85" font-size="16">✨</text>
    <text x="95" y="70" font-size="18">🌟</text>
  </g>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
    Time Without The Clock
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" opacity="0.8">
    (No distance, no time differences)
  </text>
</svg>
