<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg6)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.65" />
  <!-- Two hands holding / two intertwined hearts -->
  <g transform="translate(130, 110)">
    <!-- Heart 1 -->
    <path d="M45,80 C15,50 5,30 5,18 C5,8 14,0 24,0 C34,0 44,8 45,18 C46,8 56,0 66,0 C76,0 85,8 85,18 C85,30 75,50 45,80 Z" fill="#fb7185" opacity="0.9" />
    <!-- Heart 2 intertwined -->
    <path d="M85,80 C55,50 45,30 45,18 C45,8 54,0 64,0 C74,0 84,8 85,18 C86,8 96,0 106,0 C116,0 125,8 125,18 C125,30 115,50 85,80 Z" fill="#e11d48" opacity="0.85" />
    <text x="60" y="45" font-size="20">✨</text>
  </g>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#881337" text-anchor="middle">
    Just Being Next To You
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#9f1239" text-anchor="middle" opacity="0.8">
    (Holding hands in real life)
  </text>
</svg>
