<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3" />
      <stop offset="100%" stop-color="#ffd6e0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg1)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.6" />
  <!-- Sparkles -->
  <text x="70" y="90" font-size="28">✨</text>
  <text x="310" y="100" font-size="28">🌸</text>
  <text x="90" y="320" font-size="24">💖</text>
  <text x="290" y="310" font-size="26">✨</text>
  <!-- Center Heart with Smile Motif -->
  <g filter="url(#shadow)" transform="translate(145, 120)">
    <path d="M55,100 C15,60 0,35 0,20 C0,8 10,0 22,0 C34,0 46,10 55,22 C64,10 76,0 88,0 C100,0 110,8 110,20 C110,35 95,60 55,100 Z" fill="#fb6f92" />
    <!-- Happy eyes & smile -->
    <path d="M38,32 Q45,26 52,32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M58,32 Q65,26 72,32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M44,45 Q55,58 66,45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#9f1239" text-anchor="middle">
    Your Beautiful Smile
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#be123c" text-anchor="middle" opacity="0.8">
    (Replace with our favorite picture)
  </text>
</svg>
