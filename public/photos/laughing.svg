<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.65" />
  <!-- Joy and laughter doodles -->
  <g transform="translate(135, 110)">
    <circle cx="65" cy="65" r="50" fill="#ffe4e6" stroke="#fb7185" stroke-width="3" />
    <!-- Happy curved closed eyes -->
    <path d="M42,55 Q50,45 58,55" stroke="#e11d48" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M72,55 Q80,45 88,55" stroke="#e11d48" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Big wide happy laughing mouth -->
    <path d="M45,72 Q65,102 85,72 Z" fill="#e11d48" />
    <!-- Blush cheeks -->
    <ellipse cx="38" cy="68" rx="8" ry="5" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="92" cy="68" rx="8" ry="5" fill="#f43f5e" opacity="0.4" />
  </g>
  <text x="70" y="110" font-size="24">✨</text>
  <text x="310" y="120" font-size="24">😂</text>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#881337" text-anchor="middle">
    Uncontrollable Laughter
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#9f1239" text-anchor="middle" opacity="0.8">
    (Over absolutely nothing at all)
  </text>
</svg>
