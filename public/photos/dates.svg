<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg2)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.65" />
  <!-- Coffee cups & pastry romantic illustration -->
  <g transform="translate(140, 115)">
    <!-- Cup 1 -->
    <rect x="15" y="40" width="40" height="45" rx="8" fill="#d97706" />
    <path d="M55,50 C65,50 65,65 55,65" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M25,32 Q30,22 25,12" stroke="#b45309" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M45,32 Q50,22 45,12" stroke="#b45309" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Cup 2 -->
    <rect x="70" y="46" width="38" height="39" rx="8" fill="#fb6f92" />
    <path d="M108,54 C118,54 118,67 108,67" stroke="#fb6f92" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Little heart between cups -->
    <text x="54" y="40" font-size="20">🤍</text>
  </g>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">
    Our Little Dates
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#92400e" text-anchor="middle" opacity="0.8">
    (Coffee, walks & quiet talks)
  </text>
</svg>
