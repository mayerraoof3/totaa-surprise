<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg4)" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.65" />
  <!-- Cute Camera Illustration -->
  <g transform="translate(135, 110)">
    <!-- Camera Body -->
    <rect x="15" y="30" width="100" height="70" rx="14" fill="#a855f7" />
    <rect x="40" y="20" width="30" height="12" rx="4" fill="#9333ea" />
    <circle cx="95" cy="42" r="6" fill="#f3e8ff" />
    <!-- Lens -->
    <circle cx="65" cy="65" r="26" fill="#581c87" />
    <circle cx="65" cy="65" r="20" fill="#7e22ce" />
    <circle cx="58" cy="58" r="5" fill="#f3e8ff" opacity="0.7" />
    <!-- Heart flash -->
    <text x="80" y="25" font-size="20">💖</text>
  </g>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#581c87" text-anchor="middle">
    A Hundred Photos Together
  </text>
  <text x="200" y="300" font-family="sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" opacity="0.8">
    (The silly ones are the best)
  </text>
</svg>
